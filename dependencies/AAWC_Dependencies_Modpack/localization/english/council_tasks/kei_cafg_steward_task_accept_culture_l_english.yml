task_kCAFG_accept_culture_desc_focus_detail: "\n\n#S Yearly Acceptance Increase: [GuiScope.SetRoot(councillor.MakeScope.Var('kCAFG_task_accept_culture_focused_culture').Culture.MakeScope).AddScope('councillor', councillor.MakeScope).AddScope('councillor_liege', councillor_liege.MakeScope).ScriptValue('V_kCAFG_steward_acceptance_bonuses')|+=2]#!\n$task_kCAFG_accept_culture_desc_focus_breakdown$"
task_kCAFG_accept_culture_desc_focus_breakdown: "[GuiScope.SetRoot(councillor.MakeScope.Var('kCAFG_task_accept_culture_focused_culture').Culture.MakeScope).AddScope('councillor', councillor.MakeScope).AddScope('councillor_liege', councillor_liege.MakeScope).GetScriptValueDesc('V_kCAFG_steward_acceptance_bonuses')]"
