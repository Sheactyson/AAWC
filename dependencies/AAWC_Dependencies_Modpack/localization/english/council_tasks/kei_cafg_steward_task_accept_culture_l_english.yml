l_english:
task_kCAFG_accept_culture: "Promote $game_concept_cultural_acceptance$"
kCAFG_task_accept_culture_effect_unassigned_warning: "@alert_icon! #alert_trial The acceptance promotion will be focused on the first available [culture|E] in the [county|E] when assigning from the Council Menu, but it is possible to #S Focus the Task#! on a another [culture|E] in the Holding View.#!"
task_kCAFG_accept_culture_desc: "\n\n[cultural_acceptance|E] between the focused [culture|E] and [councillor_liege.GetCulture.GetName] will increase every year"
