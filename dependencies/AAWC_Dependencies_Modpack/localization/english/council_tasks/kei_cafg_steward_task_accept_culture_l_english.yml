kCAFG_task_accept_culture_focus_culture_tooltip_task_will_be_aborted: "\n@warning_icon! #warning Your [Character.GetActiveCouncilTask.GetPositionNamePossesive] current Task ('[Character.GetActiveCouncilTask.GetTaskType.GetName]') will be aborted.#!"
kCAFG_task_accept_culture_focus_culture_tooltip_cannot_target: "\n#warning Cannot promote our culture in the [barony|E] of [Province.GetName]:#!\n[GetScriptedGui('kCAFG_is_task_accept_culture_possible_scripted_gui').BuildTooltip(GuiScope.SetRoot(Character.MakeScope).AddScope('kCAFG_culture', Culture.MakeScope).AddScope('kCAFG_province', Province.MakeScope).End)]"
kCAFG_task_accept_culture_focus_culture_tooltip_progress_breakdown_title: "\n#L Estimated Cultural Acceptance Yearly Increase#!: [GuiScope.SetRoot(Culture.MakeScope).AddScope('councillor', Character.MakeScope).AddScope('councillor_liege', Character.GetLiege.MakeScope).ScriptValue('V_kCAFG_steward_acceptance_bonuses')|+=2]#!"
kCAFG_task_accept_culture_focus_culture_tooltip_progress_breakdown: "[GuiScope.SetRoot(Culture.MakeScope).AddScope('councillor', Character.MakeScope).AddScope('councillor_liege', Character.GetLiege.MakeScope).GetScriptValueDesc('V_kCAFG_steward_acceptance_bonuses')]"
