kCAFG_task_accept_culture_no_province_can_be_targeted: "No [culture|E] inside this [county|E] can be the subject of the acceptance of our culture."

kCAFG_task_accept_culture_focus_culture_tooltip_title: "#E [Concept('promoting_cultural_acceptance', SelectLocalization(And(Character.IsValid, ScriptedGui.IsShown(GuiScope.SetRoot(Character.MakeScope).AddScope('culture', Culture.MakeScope).AddScope('kCAFG_province', Province.MakeScope).End)), 'kCAFG_task_accept_culture_focus_culture_tooltip_title_focused', 'kCAFG_task_accept_culture_focus_culture_tooltip_title_focus'))]#!"
kCAFG_task_accept_culture_focus_culture_tooltip_title_focused: "Culture Acceptance Promotion Focus"
kCAFG_task_accept_culture_focus_culture_tooltip_title_focus: "Promote Culture Acceptance"
kCAFG_task_accept_culture_focus_culture_tooltip_desc: "[SelectLocalization(ScriptedGui.IsShown(GuiScope.SetRoot(Character.MakeScope).AddScope('culture', Culture.MakeScope).AddScope('kCAFG_province', Province.MakeScope).End), 'kCAFG_task_accept_culture_focus_culture_tooltip_desc_stop', 'kCAFG_task_accept_culture_focus_culture_tooltip_desc_start')]"
kCAFG_task_accept_culture_focus_culture_tooltip_desc_start: "Assign your [Concept('steward', GetPlayer.GetCouncillorPosition('councillor_steward').GetPositionName)|e] [Character.GetName] to the promotion of the acceptance between the [GetPlayer.GetCulture.GetName] and the [Culture.GetName]."
