l_english:
MY_REALM_SUB_LAWS_HEADER: "Laws of [GetPlayer.GetTopLiege.GetPrimaryTitle.GetNameNoTierNoTooltip]"

kCAFG_culture_tolerance_law: "[culture_tolerance_law|E]"
kCAFG_culture_tolerance_law_singular: "$kCAFG_culture_tolerance_law$"
kCAFG_culture_intolerant_law: "Cultural Intolerance"
kCAFG_culture_intolerant_law_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 [culture_tension_baseline|E] increased to #N [EmptyScope.ScriptValue('V_kCAFG_intolerant_law_tension_factor')|%0]#!#!\n$EFFECT_LIST_BULLET$Forbids the [Concept('accept_culture', Localize('task_kCAFG_accept_culture'))|L] [councillor_task|E]\n$EFFECT_LIST_BULLET$[Concept('promote_culture', Localize('task_promote_culture'))|L] [councillor_task|E] Speed: [EmptyScope.ScriptValue('V_kCAFG_intolerant_law_conversion_bonus')|%0+=]"
kCAFG_culture_indifferent_law: "Cultural Indifference"
kCAFG_culture_indifferent_law_effects_not_in_prev: "No changes to $game_concept_opinions$ and [culture_tension_baseline|E]"
kCAFG_culture_tolerant_law: "Cultural Tolerance"
kCAFG_culture_tolerant_law_effects_not_in_prev: "$EFFECT_LIST_BULLET$#indent_newline:3 [culture_tension_baseline|E] reduced to #P [EmptyScope.ScriptValue('V_kCAFG_tolerant_law_tension_factor')|%0]#!#!\n$EFFECT_LIST_BULLET$Forbids the [Concept('promote_culture', Localize('task_promote_culture'))|L] [councillor_task|E]"
kCAFG_culture_tolerance_law_is_on_cooldown: "You recently changed $kCAFG_culture_tolerance_law$. Can be changed again after [GetCurrentDateWithDiff(GetVarTimeRemaining(CHARACTER.MakeScope, 'kCAFG_culture_tolerance_law_cooldown'))]"
kCAFG_overrides_culture_tolerance_law: "Has the authority to overrule their $game_concept_vassals$ [culture_tolerance_law|E] $game_concept_laws$"
I_LACK_TRIBAL_law_allowing_culture_tolerance_law_change: "You do #BOL NOT#! have the $game_concept_law$ #high [GetLaw('tribal_authority_2').GetName]#! or better"
I_LACK_BUREAUCRACY_law_allowing_culture_tolerance_law_change: "You do #BOL NOT#! have the $game_concept_law$ #high [GetLaw('imperial_bureaucracy_1').GetName]#! or better"
I_LACK_law_allowing_culture_tolerance_law_change: "You do #BOL NOT#! have the $game_concept_law$ #high [GetLaw('crown_authority_1').GetName]#! or better"

kCAFG_allowed_to_change_tolerance_laws_tt: "One of your [lieges|E] has an [Concept('crown_authority', 'Authority')] $game_concept_law$ allowing the overruling of your tolerance [law|E]"

