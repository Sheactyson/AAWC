kCAFG_FAITH_MAP_MODE_TOOLTIP_PERCENTAGE: "Percentage of $kCAFG_FAITH_MAP_MODE_TOOLTIP_adherents$: $kCAFG_FAITH_MAP_MODE_TOOLTIP_factor_percent$"
kCAFG_FAITH_MAP_MODE_TOOLTIP_FULL: "$kCAFG_FAITH_MAP_MODE_TOOLTIP_amount$ $kCAFG_FAITH_MAP_MODE_TOOLTIP_adherents$ ($kCAFG_FAITH_MAP_MODE_TOOLTIP_factor_percent$)"
