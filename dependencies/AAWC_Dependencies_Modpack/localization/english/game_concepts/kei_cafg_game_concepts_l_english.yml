l_english:
game_concept_majority_culture: "Majority Culture"
game_concept_majority_cultures: "Majority Cultures"
game_concept_majority_culture_desc: "Among the [cultures|E] of a [county|E], the one the with the most adherents is the Majority Culture."
game_concept_minority_culture: "Minority Culture"
game_concept_minority_cultures: "Minority Cultures"
game_concept_minority_culture_desc: "All [cultures|E] of a [county|E] that are not the [majority_culture|E] are considered to be Minority Cultures."
game_concept_culture_tension: "Culture Tension"
game_concept_culture_tension_desc: "Each province has a cultural tension which encompasses the combined dissatisfaction towards the [county|E] [holder|E].\n\nThe Culture Tension will progressively drift towards the [culture_tension_baseline|E] and can be modified by events happening in the [barony|E] and the behaviour of its [rulers|E] (including the [holder|E]'s [lieges|E]) towards its [cultures|E]."
game_concept_culture_tension_baseline: "Culture Tension Baseline"
game_concept_culture_tension_baseline_desc: "Each province has a cultural tension baseline to which the [culture_tension|E] level will progressively drift.\n\nBaseline Culture Tension is determined by the [cultural_acceptance|E] between the [barony|E] and [holder|E]'s [cultures|E] and whether or not the [county|E] [holder|E] can speak their language."
game_concept_majority_faith: "Majority Faith"
game_concept_majority_faiths: "Majority Faiths"
game_concept_majority_faith_desc: "Among the [faiths|E] of a [county|E], the one the with the most adherents is the Majority Faith."
game_concept_minority_faith: "Minority Faith"
game_concept_minority_faiths: "Minority Faiths"
game_concept_minority_faith_desc: "All [cultures|E] of a [faiths|E] that are not the [majority_faith|E] are considered to be Minority Faiths."
game_concept_faith_tension: "Faith Tension"
game_concept_faith_tension_desc: "Each province has a religious tension which encompasses the combined dissatisfaction towards the [county|E] [holder|E].\n\nThe Faith Tension will progressively drift towards the [faith_tension_baseline|E] and can be modified by events happening in the [barony|E] and the behaviour of its [rulers|E] (including the [holder|E]'s [lieges|E]) towards its [faiths|E]."
game_concept_faith_tension_baseline: "Faith Tension Baseline"
game_concept_faith_tension_baseline_desc: "Each province has a religious tension baseline to which the [faith_tension|E] level will progressively drift.\n\nBaseline Faith Tension is determined by the [faith_hostility|E], [fervor|E] and specific [core_tenets|E] and [doctrines|E] of the [barony|E] and [holder|E]'s [faiths|E]."
# game_concept_province: "Province"
# game_concept_provinces: "Provinces"
# game_concept_province_desc: "The subdivision of a [county|E] which can hold a settlement ([holding|E]) and thus become a [barony|E] or a [county_capital|E]."
game_concept_culture_tolerance_law: "Cultural Tolerance"
game_concept_culture_tolerance_laws: "Cultural Tolerance Laws"
game_concept_culture_tolerance_law_desc: "$game_concept_culture_tolerance_law$ represents the attitude of the $game_concept_realm$ towards the other [cultures|E] within it.\n\nIt affects the following:\n$EFFECT_LIST_BULLET$$MOD_DIFFERENT_CULTURE_OPINION$\n$EFFECT_LIST_BULLET$$glory_hound_same_culture_opinion$\n$EFFECT_LIST_BULLET$$minority_different_culture_opinion$\n$EFFECT_LIST_BULLET$[culture_tension_baseline|E] in the $game_concept_realm$\n$EFFECT_LIST_BULLET$[promote_culture|E] [councillor_task|E]\n$EFFECT_LIST_BULLET$[accept_culture|E] [councillor_task|E]"
game_concept_faith_tolerance_law: "Religious Tolerance"
game_concept_faith_tolerance_laws: "Religious Tolerance Laws"
game_concept_faith_tolerance_law_desc: "$game_concept_faith_tolerance_law$ represents the attitude of the $game_concept_realm$ towards the other [faiths|E] within it.\n\nIt affects the following:\n$EFFECT_LIST_BULLET$$MOD_DIFFERENT_FAITH_OPINION$\n$EFFECT_LIST_BULLET$$MOD_CLERGY_OPINION$\n$EFFECT_LIST_BULLET$$glory_hound_same_faith_opinion$\n$EFFECT_LIST_BULLET$$zealot_same_faith_opinion$\n$EFFECT_LIST_BULLET$$minority_different_faith_opinion$\n$EFFECT_LIST_BULLET$[faith_tension_baseline|E] in the $game_concept_realm$\n$EFFECT_LIST_BULLET$[convert_county|E] [councillor_task|E]"
