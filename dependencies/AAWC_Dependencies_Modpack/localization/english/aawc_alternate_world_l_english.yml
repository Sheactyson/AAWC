l_english:
 rule_aawc_alt_world:0 "#G AAWC: #! #Y Alternate World #!"
 setting_aawc_alt_world_disabled:0 "Disabled"
 setting_aawc_alt_world_disabled_desc:0 "All AAWC Alternate World rules are inactive, regardless of their setting."
 setting_aawc_alt_world_enabled:0 "#high Enabled #!"
 setting_aawc_alt_world_enabled_desc:0 "AAWC Alternate World rules are enabled.#N AW settings will apply before the game starts. Using the 'Play any ruler or create your own' feature is required. Depending on settings, it may take longer to load the game.#!"
 rule_aawc_aw_random_rulers:0 "#G AAWC: #! #Y AW - Random Characters #!"
 setting_aawc_aw_yes_random_rulers:0 "#high Enabled #!"
 setting_aawc_aw_yes_random_rulers_desc:0 "Historical characters are replaced with random characters, whose faith and culture based on their location. Recommended when using other AW settings."
 setting_aawc_aw_no_random_rulers:0 "Disabled"
 setting_aawc_aw_no_random_rulers_desc:0 "Historical characters are not replaced. Not recommended when using other AW settings."
 rule_aawc_aw_cultures:0 "#G AAWC: #! #Y AW - Cultures#!" 
 setting_aawc_aw_cultures_historical:0 "Default"
 setting_aawc_aw_cultures_historical_desc:0 "Provinces start with their historical cultures."
 setting_aawc_aw_cultures_random_historical:0 "Clustered Random"
 setting_aawc_aw_cultures_random_historical_desc:0 "Cultures on the map are randomized using historical cultures. Cultures with a similar heritage will tend to cluster together." 
 setting_aawc_aw_cultures_chaotic_historical:0 "Chaotic Random"
 setting_aawc_aw_cultures_chaotic_historical_desc:0 "Every province starts with a completely random historical culture." 
 rule_aawc_aw_faiths:0 "#G AAWC: #! #Y AW - Faiths#!" 
 setting_aawc_aw_faiths_historical:0 "Default"
 setting_aawc_aw_faiths_historical_desc:0 "Provinces start with their historical faiths."
 setting_aawc_aw_faiths_random_historical:0 "Clustered Random"
 setting_aawc_aw_faiths_random_historical_desc:0 "Faiths on the map are randomized. Faiths belonging to the same religion will cluster together. " 
 setting_aawc_aw_faiths_chaotic_historical:0 "Chaotic Random"
 setting_aawc_aw_faiths_chaotic_historical_desc:0 "Every province starts with a completely random faith." 
 rule_aawc_aw_dejure:0 "#G AAWC: #! #Y AW - Landed Titles#!" 
 setting_aawc_aw_dejure_default:0 "Default"
 setting_aawc_aw_dejure_default_desc:0 "Landed titles keep their default de jure structures."
 setting_aawc_aw_dejure_random_duchy:0 "#high Random#!" #aka: Random/New Duchies
 setting_aawc_aw_dejure_random_duchy_desc:0 "De-jure duchies, kingdoms, and empires are replaced by new titles with randomized borders. #N Experimental - try at your own risk! #!"
 AAWC_NEW_TITLE_NAME:0 "[scoped_title.GetBaseNameNoTierNoTooltip]"
 rule_aawc_aw_development:0 "#G AAWC: #! #Y AW - Development #!" 
 setting_aawc_aw_development_default:0 "Default"
 setting_aawc_aw_development_default_desc:0 "Provinces start with their historical development level."
 setting_aawc_aw_development_random_25:0 "Random (0-25)"
 setting_aawc_aw_development_random_25_desc:0 "All provinces start with a random development level ranging from 0 to 25." 
 setting_aawc_aw_development_random_50:0 "Random (0-50)"
 setting_aawc_aw_development_random_50_desc:0 "All provinces start with a random development level ranging from 0 to 50." 
 setting_aawc_aw_development_random_100:0 "Random (0-100)"
 setting_aawc_aw_development_random_100_desc:0 "All provinces start with a random development level ranging from 0 to 100." 
 setting_aawc_aw_development_0:0 "#high Uniform (0)#!"
 setting_aawc_aw_development_0_desc:0 "All provinces start with development at 0."
 setting_aawc_aw_development_25:0 "#high Uniform (25)#!"
 setting_aawc_aw_development_25_desc:0 "All provinces start with development at 25."
 setting_aawc_aw_development_50:0 "#high Uniform (50)#!"
 setting_aawc_aw_development_50_desc:0 "All provinces start with development at 50."
 setting_aawc_aw_development_100:0 "#high Uniform (100)#!"
 setting_aawc_aw_development_100_desc:0 "All provinces start with development at 100."
 rule_aawc_aw_shattered_realms:0 "#G AAWC: #! #Y AW - Shattered Realms (Counties Required) #!"
 setting_aawc_aw_no_shattered_realms:0 "Disabled"
 setting_aawc_aw_no_shattered_realms_desc:0 "Realms are not shattered at the start of the game."
 setting_aawc_aw_duke_shattered_realms:0 "#high Duchies #!" 
 setting_aawc_aw_duke_shattered_realms_desc:0 "All realms start as duchies with proper de-jure borders. Dukes are randomly chosen, with a preference for historical dukes. #N NOTE: If using custom rulers, please create the ruler after setting this rule! #!"
 setting_aawc_aw_count_shattered_realms:0 "#high Counties (AAWC Required) #!" 
 setting_aawc_aw_count_shattered_realms_desc:0 "Every ruler is an independent count. All AAWC world modes enforce this result even if a saved or custom preset selects another setting. #N NOTE: If using custom rulers, please create the ruler after setting this rule! #!"
 setting_aawc_aw_king_shattered_realms:0 "#high Kingdoms #!"
 setting_aawc_aw_king_shattered_realms_desc:0 "All realms start as kingdoms with proper de-jure borders. Kings are randomly chosen, with a preference for historical kings. #N NOTE: If using custom rulers, please create the ruler after setting this rule! #!"
 setting_aawc_aw_emperor_shattered_realms:0 "#high Empires #!"
 setting_aawc_aw_emperor_shattered_realms_desc:0 "All realms start as empires with proper de-jure borders. Emperors are randomly chosen, with a preference for historical emperors. #N NOTE: If using custom rulers, please create the ruler after setting this rule! #!"
 rule_aawc_aw_shattered_realms_landless:0 "#G AAWC: #! #Y AW - Shatter Landless Titles #!"
 setting_aawc_aw_disabled_shattered_realms_landless:0 "Disabled"
 setting_aawc_aw_disabled_shattered_realms_landless_desc:0 "Landless titles (such as the Papacy) are not destroyed at the start of the game."
 setting_aawc_aw_enabled_shattered_realms_landless:0 "#high Enabled #!" 
 setting_aawc_aw_enabled_shattered_realms_landless_desc:0 "Landless titles are destroyed at the start of the game. This setting has no effect if the Shattered Realms rule is set to Disabled."
 rule_aawc_aw_baronies:0 "#G AAWC: #! #Y AW - Baronies #!"
 setting_aawc_aw_baronies_default:0 "Default"
 setting_aawc_aw_baronies_default_desc:0 "All barony-level holdings (castles, temples, cities, etc.) remain unchanged."
 setting_aawc_aw_baronies_none:0 "None"
 setting_aawc_aw_baronies_none_desc:0 "All barony-level holdings (castles, temples, cities, etc.), except for capital holdings will be removed. #N Experimental - may cause crashes or loading errors. #!"
 rule_aawc_aw_holdings:0 "#G AAWC: #! #Y AW - Governments (Tribal Required) #!"
 setting_aawc_aw_default_holdings:0 "Default"
 setting_aawc_aw_default_holdings_desc:0 "Realms start as tribes or feudal depending on start date, geographic location, culture and/or faith. Settlements are not changed."
 setting_aawc_aw_random_holdings:0 "#high Full Random #!"
 setting_aawc_aw_random_holdings_desc:0 "All independent rulers start with a random government. Non-baron vassals tend to have the same government type as their liege. Settlements are converted to the ruler's preference."
 setting_aawc_aw_random_ft_holdings:0 "#high Random #!"
 setting_aawc_aw_random_ft_holdings_desc:0 "All rulers randomly start as tribal or feudal/clan. Settlements are converted to the ruler's preference."
 setting_aawc_aw_feudal_holdings:0 "#high All Feudal #!"
 setting_aawc_aw_feudal_holdings_desc:0 "Every ruler starts with a feudal style government. All tribal settlements are converted to castles."
 setting_aawc_aw_tribal_holdings:0 "#high All Tribal (AAWC Required) #!"
 setting_aawc_aw_tribal_holdings_desc:0 "Every ruler starts with a tribal style government. All castles are converted to tribal settlements. All AAWC world modes enforce this result even if a saved or custom preset selects another setting."
 setting_aawc_aw_nomad_holdings:0 "#high All Nomadic #!"
 setting_aawc_aw_nomad_holdings_desc:0 "Every ruler starts with a nomadic government. All castles are converted to nomad settlements. Pre-existing herds will remain intact."
