l_english:
kCAFG_court_chaplain_task_conversion.9001.opening: "[councillor.Custom2('AppropriateGreeting', SCOPE.sC('councillor_liege'))]"
kCAFG_court_chaplain_task_conversion.9001.desc: "Our efforts to convert [focused_province.GetName] are successful so far.\nHowever, since it would take up a lot of time to continue in [focused_province.GetName], I advise that our efforts be redirected somewhere more deserving."
kCAFG_court_chaplain_task_conversion.9001.desc_tension: "Our efforts to convert [focused_province.GetName] are successful so far.\nHowever, since [focused_province.GetName] show signs of its [faith_tension] fading away, I advise that our efforts be redirected somewhere more deserving."
kCAFG_court_chaplain_task_conversion.9001.desc_complete: "Our efforts to convert [focused_province.GetName] have come to fruition. Indeed, all of our subjects there reportedly follow our faith.\nI am at your disposal to continue my duties where beneficial."
kCAFG_court_chaplain_task_conversion.9001.a: "Very well, you know best."
kCAFG_court_chaplain_task_conversion.9001.a_complete: "Excellent, you may proceed wherever you see appropriate."
kCAFG_court_chaplain_task_conversion.9001.a.tt: "[councillor.GetFirstNameNoTooltip] will start converting to our [faith|E] in [kCAFG_selected_province_to_focus.GetName]"
kCAFG_court_chaplain_task_conversion.9001.b: "Keep converting [focused_province.GetName]."
kCAFG_court_chaplain_task_conversion.9001.b.tt: "[councillor.GetFirstNameNoTooltip] continues converting to our [faith|E] in [focused_province.GetName]"
kCAFG_court_chaplain_task_conversion.9001.c: "Return to your other duties."
kCAFG_court_chaplain_task_conversion.9001.c.tt: "[councillor.GetFirstNameNoTooltip] switches to [councillor.GetHerHis] default task"
kCAFG_court_chaplain_task_conversion.9001.d: "Don't bother me with this ever again."
kCAFG_court_chaplain_task_conversion.9001.d.tt: "You won't be notified with this suggestion letter ever again. You will be able to reverse your decision by using the #S $kCAFG_accept_court_chaplain_conversion_suggestions_again$#! [interaction|E] with your councillor."