l_english:
kCAFG_cultural_benefits_events.0001.t: "[culture.GetNameNoTooltip] Cultural Benefits"
kCAFG_cultural_benefits_events.0001.t.unclear: "[culture.GetNameNoTooltip] Cultural Benefits...?"
kCAFG_cultural_benefits_events.0001.desc: "Fostering the [culture.GetName] culture is bearing fruit!\nThe [culture.GetCollectiveNounNoTooltip] seem to appreciate the way they are treated in my realm and are becoming more and more willing to trade and exchange knowledge with the other inhabitants.\n\n"
kCAFG_cultural_benefits_events.0001.desc.gift: "One of their representative has presented me with a gift demonstrating the quality and fame of their traditional craft."
kCAFG_cultural_benefits_events.0001.desc.gold_gift: "They were kind enough to offer me many valuable objects, a sign of the wealth resulting from our cooperation."
kCAFG_cultural_benefits_events.0001.desc.gold_loot: "They brought me a share of the booty they'd acquired on their latest piratical expeditions to foreign lands."
kCAFG_cultural_benefits_events.0001.desc.impressive_character: "I've been informed that a particularly outstanding individual named [impressive_character.GetName] is well known among the [culture.GetCollectiveNounNoTooltip] for [impressive_character.GetHerHis] competence and could potentially be of use to me."
kCAFG_cultural_benefits_events.0001.desc.talent_acquisition: "However, this case is quite peculiar. After serious transgressions within my lands, a criminal named [talent_acquisition.GetName] was finally arrested and brought to my gaols.\nThe nobles with whom he shares his traditions have a habit of recruiting competent criminals who trade their judgment for their loyalty.\n\nEven my most condemnatory [knights] admit to his out of the ordinary fighting skills..."
kCAFG_cultural_benefits_events.0001.desc.province_modifier: "Their bustling activity are showing numerous positive repercussions on my domain."
kCAFG_cultural_benefits_events.0001.desc.character_modifier: "The most competent among them have contributed greatly to new insights that will be useful to me as a $game_concept_ruler$."
kCAFG_cultural_benefits_events.0001.desc.maa_refill_gift: "[culture.GetCollectiveNounNoTooltip] warriors have decided to pledge loyalty to me and join me in my battles to come."
kCAFG_cultural_benefits_events.0001.desc.esteemed_hospitality: "Three [culture.GetCollectiveNounNoTooltip] have decided that my $game_concept_court$ was to their liking and decided to come unannounced, as is tradition in their culture."
kCAFG_cultural_benefits_events.0001.a: "A pleasant surprise!"
kCAFG_cultural_benefits_events.0001.a.gift: "A welcomed gift!"
kCAFG_cultural_benefits_events.0001.a.impressive_character: "I could invite [impressive_character.GetHerHim] to my court."
kCAFG_cultural_benefits_events.0001.a.talent_acquisition: "[talent_acquisition.GetHerHis|U] recruitment remains my decision..."
kCAFG_cultural_benefits_events.0001.a.esteemed_hospitality: "Hmm..."

kCAFG_base_gift_name: "Gift of the [culture.GetCollectiveNounNoTooltip]"
kCAFG_tradition_artisans_gift_name: "$kCAFG_base_gift_name$ Artisans"
kCAFG_tradition_sorcerous_metallurgy_gift_name: "$kCAFG_base_gift_name$ Metallurgists"
kCAFG_horse_breeders_gift_name: "$kCAFG_base_gift_name$ Horse Breeders"
kCAFG_cultural_maa_gift_name: "Loyal [culture.GetCollectiveNounNoTooltip] Warriors"

E_kCAFG_cultural_boon_tradition_maa_cavalry_refill_tt: "Some of your cavalry $game_concept_men_at_arms$ have been refilled"
E_kCAFG_cultural_boon_tradition_maa_refill_tt: "Some of your [GetMaA(SCOPE.GetFlagName('maa_refill_gift_name')).GetName] $game_concept_men_at_arms$ have been refilled"
E_kCAFG_cultural_boon_tradition_maa_gift_tt: "You have been gifted an $game_concept_army$ of [GetMaA(SCOPE.GetFlagName('maa_refill_gift_name')).GetName] in [province.GetName]"
E_kCAFG_cultural_boon_cultural_acceptance_bonus_ritualized_friendship_tt: "$tradition_fp2_ritualised_friendship_name$ Cultural Benefit"
E_kCAFG_cultural_boon_character_modifier_tt: "You gain [GetModifier(TopScope.GetFlagName('modifier')).GetNameWithTooltip] for #V [TopScope.GetValue('modifier_duration')] years#!"
E_kCAFG_cultural_boon_province_modifier_tt: "[THIS.Province.GetTitle.GetTierAsNameNoTooltip] of [THIS.Province.GetName] gets [GetModifier(TopScope.GetFlagName('modifier')).GetNameWithTooltip] for #V [TopScope.GetValue('modifier_duration')] years#!"
E_kCAFG_cultural_boon_county_modifier_tt: "[THIS.Title.GetName] gets [GetModifier(TopScope.GetFlagName('modifier')).GetNameWithTooltip] for #V [TopScope.GetValue('modifier_duration')] years#!"
