 game_concept_aawc_regional_blockers_concept:0 "Regional Blockers"
 game_concept_aawc_regional_blockers_concept_desc:0 "Newly colonized or reclaimed AAWC holdings begin with four distinct obstacle chains chosen for their region and eligible terrain. The system draws from twenty hazard categories; each category applies its own kind of county penalty, while severity controls the penalty's scale and the number of clearance stages. Minor chains have two paid levels, Standard three, Severe four, and Deadly five. Penalties recede as work advances, but every active level blocks settlement conversion until the final level is finished. Each level charges its listed native resources normally and separately reserves its displayed surplus-population share at construction start, refunds that share on cancellation, and consumes it on completion. A duchy-capital holding receives a Deadly first-slot guarantee; an ordinary county-capital holding receives a Severe first-slot guarantee. The other slots roll 5% Severe, 35% Standard, and 60% Minor. Existing settlements cleaned during the redesign rollout have their legacy AAWC placement blockers removed and are not retrofitted with regional chains. An initialized, non-exempt colony may gain at most one ambient Minor or Standard chain: it rolls only with a free building slot, after five-year intervals, beginning at 5% and gaining 5 percentage points after each failed roll."
