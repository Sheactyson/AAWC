 building_type_winterfell_maintained_01_desc:0 "Winterfell is standing again. The worst collapses have been stabilized, key halls are habitable, and the defenses are serviceable, but the castle remains unfinished. A final, monumental restoration is still required before Winterfell can truly reclaim its legendary stature."
