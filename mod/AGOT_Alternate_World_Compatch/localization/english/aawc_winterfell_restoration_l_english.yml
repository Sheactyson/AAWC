 winterfell_ruined_01:0 "Winterfell in Ruins"
 building_type_winterfell_ruined_01_desc:0 "The ancient seat of House Stark has been reclaimed from total desolation, but its walls are fractured, its yards are unsafe, and its strength is only beginning to return. It can shelter men once more, yet restoring Winterfell will demand years of labor and immense expense."
