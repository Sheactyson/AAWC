 aawc_population_reserved_concept_desc:0 "Population already committed to active colonization/reclamation expeditions."
 aawc_population_available_concept:0 "Available Population"
 aawc_population_available_concept_desc:0 "Population currently usable for new expeditions.\n\nFormula: max(0, Total - Expected - Reserved)."

