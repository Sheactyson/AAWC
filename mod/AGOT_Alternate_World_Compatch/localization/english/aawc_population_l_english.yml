 aawc_population_total_concept:0 "Total Population"
 aawc_population_total_concept_desc:0 "The current living population tracked on holdings. Monthly cohort births and deaths change the total; aging moves residents between age groups. Migration and other population transfers are accounted for separately."
 aawc_population_expected_concept:0 "Expected Population"
 aawc_population_expected_concept_desc:0 "The holding capacity target produced by the main holding line, development scaling, and buildings. Population growth diminishes as current population approaches or exceeds this value."
 aawc_population_surplus_concept:0 "Surplus Population"
 aawc_population_surplus_concept_desc:0 "Population above expected capacity. Surplus can supply men-at-arms replenishment, fund colonization and ruin reclamation, and establish new settlements inside owned counties."
 aawc_population_building_growth_rating_concept:0 "Building Growth Rating"
 aawc_population_building_growth_rating_concept_desc:0 "Building Growth Rating is the combined growth score from buildings in this holding.\n\nRating thresholds:\n#N -500#! or lower: #high x0.10#!\n#N -400#!: #high x0.15#!\n#N -300#!: #high x0.22#!\n#N -220#!: #high x0.32#!\n#N -150#!: #high x0.45#!\n#N -100#!: #high x0.58#!\n#N -65#!: #high x0.72#!\n#N -35#!: #high x0.85#!\n#N -15#!: #high x0.93#!\n#high -14 to 4#!: #high x1.00#!\n#P 5#!: #high x1.10#!\n#P 15#!: #high x1.20#!\n#P 40#!: #high x1.30#!\n#P 80#!: #high x1.40#!\n#P 140#!: #high x1.50#!\n#P 220#!: #high x1.65#!\n#P 320#!: #high x1.80#!\n#P 420#!: #high x1.92#!\n#P 500#! or higher: #high x2.00#!"
 aawc_population_terrain_suitability_concept:0 "Terrain Suitability"
 aawc_population_terrain_suitability_concept_desc:0 "Terrain Suitability represents how easily a holding's terrain supports population growth.\n\nUrban: #P x1.30#!\nFarmlands, floodplains, oasis: #P x1.25#!\nPlains, forest, taiga, cloud forest: #P x1.10#!\nSteppe, hills: #P x1.05#!\nWetlands and bogs: #N x0.95#!\nMountains, highlands, desert mountains, canyon: #N x0.90#!\nDrylands: #N x0.85#!\nDesert, glacier, frozen flats: #N x0.70#!"
 aawc_population_pressure_concept:0 "Population Pressure"
 aawc_population_pressure_concept_desc:0 "Population Pressure compares current population to expected population. It tapers growth as a holding fills.\n\n0-5% expected: #P x2.00#!\n5-10%: #P x1.80#!\n10-15%: #P x1.60#!\n15-20%: #P x1.40#!\n20-25%: #P x1.20#!\n25-75%: #high x1.00#!\n75-80%: #high x0.99#!\n80-85%: #high x0.96#!\n85-90%: #high x0.91#!\n90-95%: #high x0.84#!\n95-100%: #high x0.75#!\n100-105%: #N x0.64#!\n105-110%: #N x0.51#!\n110-115%: #N x0.36#!\n115-120%: #N x0.19#!\n120-125%: #N x0.05#!\n125% or higher: #N x0.00#!"
 aawc_population_plague_growth_concept:0 "Plague Mortality"
  aawc_population_plague_growth_concept_desc:0 "Plagues increase mortality in the authoritative monthly cohort update. They do not use a separate three-month population-growth override."
