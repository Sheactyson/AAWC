 AAWC_POPULATION_TT_COUNTY_CONTROL:0 "#T Control#!\nCounty control directly scales normal population growth in every holding here.\n\nAt #high 100#! control, growth uses a #high x1.00#! multiplier. At #high 50#! control, growth uses #high x0.50#!. At #high 0#! control, normal growth is stopped before population pressure is applied."
