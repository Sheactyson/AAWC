 AAWC_STAGE2_TT_SUSTENANCE:0 "#T Sustenance#!\nEffective: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_effective_sustenance_value'))]#! / 100\nStructural: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_structural_sustenance_value'))]#! / 100\n\nAccess to dependable food and essential supplies. Effective Sustenance influences fertility and hardship mortality."
 AAWC_STAGE2_TT_HABITATION:0 "#T Habitation#!\nEffective: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_effective_habitation_value'))]#! / 100\nStructural: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_structural_habitation_value'))]#! / 100\n\nHousing and usable living space. Structural Habitation is the strongest physical-capacity contributor; crowding lowers the effective score."
 AAWC_STAGE2_TT_OPPORTUNITY:0 "#T Opportunity#!\nEffective: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_effective_opportunity_value'))]#! / 100\nStructural: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_structural_opportunity_value'))]#! / 100\n\nAccess to livelihoods, exchange, and advancement. Opportunity has a smaller fertility role and does not generically increase physical capacity."
 AAWC_STAGE2_TT_HEALTH:0 "#T Health#!\nEffective: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_effective_health_value'))]#! / 100\nStructural: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_structural_health_value'))]#! / 100\n\nSanitation, care, and resistance to illness. Effective Health influences age-sensitive mortality and falls under severe crowding or disease."
 AAWC_STAGE2_TT_SECURITY:0 "#T Security#!\nEffective: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_effective_security_value'))]#! / 100\nStructural: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_structural_security_value'))]#! / 100\n\nSafety from violence and disruption. Security matters most during actual danger and exceptional instability."
 AAWC_STAGE2_TT_AMENITIES:0 "#T Amenities#!\nEffective: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_effective_amenities_value'))]#! / 100\nStructural: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_structural_amenities_value'))]#! / 100\n\nComfort, services, and civic or cultural quality. Amenities describe life quality without acting as a generic capacity or mortality bonus."
 AAWC_STAGE2_TT_OCCUPANCY:0 "#T Occupancy and Crowding#!\nCurrent residents: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_total'))]#!\nPhysical capacity: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_physical_capacity'))]#!\nOccupancy: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_stage2_occupancy_percent_display'))]%#!\n\nCrowding begins to reduce effective Habitation above 80% occupancy and effective Health above 90%. Physical capacity is not a hard cap and residents are never deleted merely for exceeding it."
  AAWC_POPULATION_FORMULA_HINT:0 "Population is updated monthly by the authoritative cohort ledger: births, mortality, and aging change the thirteen age bands. Growth Rating and Growth Rate are retained as legacy capacity and pressure context, not as a three-month projection. Expected population is capacity from the main holding line, development, and buildings."

