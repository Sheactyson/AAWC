 aawc_population_event.0420.t:0 "Population: Topics"
 aawc_population_event.0420.desc:0 "#high Population system#!\n\nAAWC tracks people as a living value on each holding. A holding is one barony slot with a holding type, such as a tribe, castle, city, temple, settlement, ruin, or wilderness.\n\nThe most important terms are #tooltip:AAWC_WIKI_TT_TOTAL_POPULATION #E Total Population#!#!, #tooltip:AAWC_WIKI_TT_EXPECTED_POPULATION #E Expected Population#!#!, #tooltip:AAWC_WIKI_TT_SURPLUS_POPULATION #E Surplus Population#!#!, #tooltip:AAWC_WIKI_TT_RESERVED_POPULATION #E Reserved Population#!#!, and #tooltip:AAWC_WIKI_TT_AVAILABLE_POPULATION #E Available Population#!#!.\n\nPopulation is used by growth, migration, men-at-arms replenishment, settlement establishment, ruin reclamation, and wilderness colonization."
 aawc_population_event.0420.core:0 "Core Terms"
 aawc_population_event.0420.capacity:0 "Capacity and Surplus"
 aawc_population_event.0421.t:0 "Population: Core Terms"
 aawc_population_event.0421.desc:0 "#high Page: Population / Core Terms#!\n\n#high Total Population#! is the current number of people living in a holding. It changes through monthly growth, plague mortality, warfare losses, migration, settlement costs, reclamation costs, and men-at-arms replenishment.\n\n#high Expected Population#! is the holding's capacity target. It is not a hard cap. It is the value the growth pressure system compares against current population.\n\n#high Surplus Population#! is Total Population minus Expected Population. Positive surplus means the holding has people above its expected capacity. Negative surplus means the holding is below expected capacity.\n\n#high Reserved Population#! is surplus already committed to an expedition or workflow. #high Available Population#! is surplus not currently reserved and is the amount expansion systems can spend."
 aawc_population_event.0422.t:0 "Population: Capacity and Surplus"
 aawc_population_event.0422.desc:0 "#high Page: Population / Capacity and Surplus#!\n\nExpected Population is built from two main pieces: #tooltip:AAWC_WIKI_TT_MAIN_CAPACITY #E Main Capacity#!#! and #tooltip:AAWC_WIKI_TT_BUILDING_CAPACITY #E Building Capacity Bonus#!#!.\n\nMain Capacity comes from the holding type and holding level. County development scales the main capacity by #high 0.45%#! per development point. Building Capacity Bonus comes from buildings and is added on top of the main line.\n\nSurplus matters because it is spendable. It can supply men-at-arms replenishment, pay population costs for colonization or reclamation, and establish new settlements inside an already owned county. A holding may still grow while below expected capacity, but growth pressure changes how quickly it does so."
 aawc_population_event.0430.t:0 "Growth: Topics"
  aawc_population_event.0430.desc:0 "#high Population change system#!\n\nAAWC updates population through the authoritative monthly cohort ledger. Births, mortality, and aging change the thirteen age bands, and their sum becomes the holding population.\n\nThe County view's #high Growth Rating#! and #high Growth Rate#! rows are retained as legacy capacity and pressure context; they are not a three-month projection and do not drive the cohort update."
 aawc_population_event.0430.formula:0 "Formula and Timing"
 aawc_population_event.0430.modifiers:0 "Ratings, Terrain, Pressure, and Plagues"
 aawc_population_event.0431.t:0 "Growth: Formula and Timing"
  aawc_population_event.0431.desc:0 "#high Page: Population Change / Timing#!\n\nThe production population authority runs once per month. It applies births and mortality to the cohort ledger, performs scheduled aging, and then synchronizes Total Population from the thirteen age bands.\n\nHolding type, buildings, terrain, control, and expected population remain useful capacity and pressure context. They do not convert into a separate three-month population-growth payment.\n\nThe displayed monthly change is the result of the authoritative cohort update."
 aawc_population_event.0432.t:0 "Growth: Ratings and Overrides"
  aawc_population_event.0432.desc:0 "#high Page: Population Change / Context#!\n\n#tooltip:AAWC_POPULATION_HELP_BUILDING_RATING #E Building Growth Rating#!#! and #tooltip:AAWC_POPULATION_HELP_TERRAIN #E Terrain Suitability#!#! remain the legacy capacity context shown in the County view.\n\n#tooltip:AAWC_POPULATION_HELP_PRESSURE #E Population Pressure#!#! compares current population to expected population. It remains useful context for a holding's capacity state, but it is not a separate population payment.\n\n#tooltip:AAWC_POPULATION_HELP_PLAGUE #E Plagues#!#! affect cohort mortality during the monthly authoritative update."
 aawc_population_event.0440.t:0 "Migration: Topics"
 aawc_population_event.0440.desc:0 "#high Migration system#!\n\nAAWC has two migration layers. #high County Migration#! moves population between neighboring counties. #high Holding Migration#! redistributes population among holdings inside the same county.\n\nCounty Migration is driven by migration ratings. Holding Migration is driven by surplus and need inside the county. Both systems respect send and receive caps so population moves gradually instead of teleporting across the map."
 aawc_population_event.0440.county:0 "County Migration"
 aawc_population_event.0440.holding:0 "Holding Migration"
 aawc_population_event.0440.eligibility:0 "Faith, Culture, and War"
 aawc_population_event.0441.t:0 "Migration: County Migration"
 aawc_population_event.0441.desc:0 "#high Page: Migration / County Migration#!\n\nEvery month, eligible counties compare migration ratings with nearby counties. Higher-rated counties pull population from lower-rated counties at #high 1#! population per rating point difference, limited by each side's population-based send and receive caps.\n\nThe rating starts at #high 100#!. Popular opinion adds directly to the rating. War reduces rating by #N 50#!. A county-holder faith mismatch reduces it by #N 20#!. A county-holder culture mismatch reduces it by #N 20#!. Each liege above the county holder with mismatched faith or culture adds another #N 5#! penalty for that mismatch type. Building migration rating exists as a stored term for future building effects.\n\nCounty pressure determines caps. Below 10% expected population, a county can receive up to 5% and send 0%. From 10-25%, it can send 1% and receive 4%. From 25-50%, send 2% and receive 3%. From 50-75%, send 3% and receive 2%. From 75-100%, send 4% and receive 1%. At 100-125%, send 5% and receive 0%."
 aawc_population_event.0442.t:0 "Migration: Holding Migration"
 aawc_population_event.0442.desc:0 "#high Page: Migration / Holding Migration#!\n\nHolding Migration moves people inside a county. Holdings below expected capacity pull from holdings with surplus. Holdings with surplus can give, and holdings below expected capacity can receive.\n\nInternal holding migration can move up to #high 3%#! of a holding's population each month. A holding at or below 25% of expected capacity can receive at the full 3% rate. A holding at 125% expected capacity can send at the full 3% rate. Values between those points scale between those extremes.\n\nHolding Migration also protects a floor. People will not migrate out if doing so would push the holding below the higher of #high 250#! population or #high 10%#! of expected population."
 aawc_population_event.0443.t:0 "Migration: Faith, Culture, and War"
 aawc_population_event.0443.desc:0 "#high Page: Migration / Faith, Culture, and War#!\n\nPeacetime migration prefers familiar destinations. In peacetime, migration requires either matching county faith or matching county culture. If neither faith nor culture aligns, migrants will not willingly move there.\n\nWar changes the rules. A county at war can send refugees to mismatched neighbors because flight from war overrides normal reluctance. Migration into a realm at war is disabled unless both sides are at war; this prevents peaceful counties from feeding population into danger while still letting war-torn counties exchange refugees.\n\nActive sieges or raids block county migration for affected counties. The Growth Rate tooltip separately shows when war suppresses normal non-plague growth."
 aawc_population_event.0450.t:0 "Military: Topics"
 aawc_population_event.0450.desc:0 "#high Military population system#!\n\nAAWC currently integrates population with men-at-arms replenishment. Men-at-arms no longer recover freely without population support. Holdings supply a limited monthly population contribution, and damaged eligible regiments consume that contribution based on their per-soldier population cost."
 aawc_population_event.0450.maa:0 "Men-at-Arms Replenishment"
 aawc_population_event.0450.contribution:0 "Military Contribution"
 aawc_population_event.0451.t:0 "Military: Men-at-Arms Replenishment"
 aawc_population_event.0451.desc:0 "#high Page: Military / Men-at-Arms Replenishment#!\n\nAAWC suppresses vanilla men-at-arms recovery and then applies population-supported recovery. Raised regiments are not supposed to replenish. Damaged unraised regiments can receive soldiers during the monthly population pulse.\n\nEach regiment type has a population cost per soldier. Costs are based on a scoring pass over the regiment's base combat power, counters, terrain and winter usefulness, size, and maintenance. The current range is #high 3#! to #high 20#! population per 1 soldier, with dragons and wyverns excluded because they are not normal player-facing men-at-arms in this system.\n\nA regiment can receive at most one twelfth of its maximum size per monthly tick, floored to a whole soldier, and still limited by missing soldiers and available population budget. When multiple damaged regiments compete, the system tries to spend available population efficiently across valid regiments rather than wasting budget on unusable remainder values."
 aawc_population_event.0452.t:0 "Military: Military Contribution"
 aawc_population_event.0452.desc:0 "#high Page: Military / Military Contribution#!\n\nMilitary Contribution is tracked on each holding. It shows how much population the holding can provide for men-at-arms replenishment and how much it actually provided recently.\n\nA holding can contribute only population above its protective floor. The protective floor is the lower of #high 25%#! of expected capacity or #high 2,000#! population. After that, the holding can spend no more than #high 1%#! of its current population each month.\n\nThe County view tooltip shows the maximum monthly contribution, last month's contribution, and a rolling one-year contribution total. The one-year value is a first-in-first-out stack of the last #high 12#! monthly ticks."
 aawc_population_event.0460.t:0 "Reclamation and Colonization: Topics"
 aawc_population_event.0460.desc:0 "#high Reclamation and colonization#!\n\nAAWC uses population as manpower for restoring dead land. Ruins and wilderness are not free land grabs. A ruler must have enough gold, available surplus population, and settlement capacity before beginning the workflow."
 aawc_population_event.0460.reclaim:0 "Ruin and Wilderness Workflow"
 aawc_population_event.0460.costs:0 "Costs and Spending"
 aawc_population_event.0461.t:0 "Reclamation: Ruins and Wilderness"
 aawc_population_event.0461.desc:0 "#high Page: Reclamation / Ruins and Wilderness#!\n\nA ruin is a devastated former holding. Wilderness is unsettled land. Both can be reclaimed through AAWC-controlled GUI buttons and AI actions.\n\nNew AAWC colonies receive four blocker chains drawn from their own region and eligible local terrain. A duchy-capital holding receives one Deadly first-slot blocker; an ordinary county-capital holding receives one Severe first-slot blocker. The other slots roll 5% Severe, 35% Standard, and 60% Minor. Ruin size does not change those remaining rolls.\n\nColonizing or reclaiming creates a settlement workflow rather than instantly creating a mature castle, temple, city, or tribal hold. Every paid level remains an obstacle, so all levels of every chain must be cleared before conversion. County-capital settlements then follow the ruler's government rules. Existing settlements at the regional-blocker rollout have their legacy AAWC placement blockers removed without replacement and are not retrofitted with new chains."
 aawc_population_event.0462.t:0 "Reclamation: Costs and Spending"
 aawc_population_event.0462.desc:0 "#high Page: Reclamation / Costs and Spending#!\n\nWilderness colonization costs #high 500#! available surplus population per barony slot in the county, with a minimum of #high 500#!. Ruin reclamation costs #high 1,000#! available surplus population per barony slot, with a minimum of #high 1,000#!. Owned-county settlement establishment uses #high 1,000#! population and #high 250#! gold per already built holding.\n\nRegional blocker chains have exact whole-chain prices: Minor #high 200 native resources + 500 surplus population#!; Standard #high 500 + 1,000#!; Severe #high 1,250 + 2,500#!; Deadly #high 3,000 + 7,500#!. Gold, Prestige, and Piety may be split differently by chain, and every paid level displays its own share. Population is reserved when that level starts, refunded if cancelled, and consumed only when it finishes.\n\nPopulation spending draws from eligible realm surplus rather than deleting people from one arbitrarily selected holding."
 aawc_population_event.0470.t:0 "Settlements: Topics"
 aawc_population_event.0470.desc:0 "#high Settlement system#!\n\nA settlement is an intermediate holding. It represents people moving into an undeveloped place and clearing it for a permanent holding. It is intentionally weaker and slower than a finished castle, temple, city, or tribal hold."
 aawc_population_event.0470.establish:0 "Establishing Settlements"
 aawc_population_event.0470.convert:0 "Converting Settlements"
 aawc_population_event.0471.t:0 "Settlements: Establishing Settlements"
 aawc_population_event.0471.desc:0 "#high Page: Settlements / Establishing Settlements#!\n\nInside an already owned county, an empty holding slot can be settled through #high Establish Settlement#!. The cost is based on the number of built holdings already in the county, so filling a developed county becomes progressively more expensive.\n\nThe new settlement starts with #high 250#! population and four distinct regional blocker chains. Each chain is one obstacle with two paid levels when Minor, three when Standard, four when Severe, or five when Deadly. A chain remains a blocker through every paid level; completing only its first level does not clear the slot.\n\nA newly initialized, non-exempt colony may later receive at most one ambient Minor or Standard chain. It can roll only every five years and only while it has a free building slot. The first roll is 5%; each failed roll raises the next chance by five percentage points. Colonies cleaned during the regional-blocker rollout are permanently exempt: their legacy AAWC placement blockers were removed, but they are not given replacement chains.\n\nSettlement limit matters. AAWC resyncs the settlement tracker and includes AAWC-created settlements, so rulers should not exceed their active settlement allowance through the AAWC workflows."
 aawc_population_event.0472.t:0 "Settlements: Converting Settlements"
 aawc_population_event.0472.desc:0 "#high Page: Settlements / Converting Settlements#!\n\nA settlement should convert only through AAWC buttons or AI equivalents. The settlement must be mature, clear of blockers, free of construction, and meet development requirements before the conversion button appears.\n\nA tribal ruler sees #high Tribalize Settlement#! and converts the settlement into a tribal hold. A non-tribal ruler sees #high Feudalize Settlement#! and can choose a castle, temple, or city for non-capital settlements. Existing settlement population carries over.\n\nWhen a tribal holding is converted after government reform, population above #high 50%#! of the incoming holding's expected capacity is capped away so feudalization does not create immediate surplus. Tribal-only buildings can be removed during the transition."
 aawc_population_event.0480.t:0 "AI and World Behavior: Topics"
 aawc_population_event.0480.desc:0 "#high AI behavior#!\n\nAAWC gives AI rulers access to the same broad population systems as the player. AI rulers can establish settlements, colonize or reclaim unclaimed land, and convert mature settlements when requirements are met."
 aawc_population_event.0480.postures:0 "AI Postures and Limits"
 aawc_population_event.0481.t:0 "AI: Postures and Limits"
 aawc_population_event.0481.desc:0 "#high Page: AI / Postures and Limits#!\n\nEach year, eligible AI rulers choose an AAWC posture. The posture is weighted by education style and drives whether they are more likely to build internally, explore unclaimed land, or avoid spending population on AAWC expansion that year.\n\nThe four current postures are #high Marshal#!, #high Builder#!, #high Explorer#!, and #high Schemer#!. Builder favors establishing settlements inside owned counties. Explorer favors colonizing or reclaiming outside the current county. Marshal and Schemer usually preserve resources for non-AAWC behavior such as war, men-at-arms, schemes, or politics.\n\nAI behavior respects the settlement limit. If the ruler is at or above their active settlement cap, the AI should focus on existing settlements instead of starting another one. AI settlement creation and colonization use the same proportional population spending helpers as the player-facing workflows."
 AAWC_WIKI_TT_TOTAL_POPULATION:0 "The current number of people stored on a holding. This is the base value affected by growth, plague loss, warfare loss, migration, military contribution, and settlement or reclamation spending."
 AAWC_WIKI_TT_EXPECTED_POPULATION:0 "The holding's expected capacity target. It is calculated from the holding's main line, county development scaling, and building capacity bonuses."
 AAWC_WIKI_TT_SURPLUS_POPULATION:0 "Total Population minus Expected Population. Positive surplus is usable by expansion and military systems; negative surplus means the holding is below its expected capacity."
 AAWC_WIKI_TT_RESERVED_POPULATION:0 "Surplus population already committed to an active colonization or reclamation workflow."
 AAWC_WIKI_TT_AVAILABLE_POPULATION:0 "Surplus population that is not reserved. This is the population pool checked by colonization, reclamation, and settlement-establishment requirements."
 AAWC_WIKI_TT_MAIN_CAPACITY:0 "Capacity supplied by the holding type and holding level before regular building bonuses are added. County development scales this value."
 AAWC_WIKI_TT_BUILDING_CAPACITY:0 "Additional expected population supplied by regular, duchy, special, and generated building effects. It is added on top of main capacity."
 aawc_population_event.0200.t:0 "A Settlement Ready to Grow"
 aawc_population_event.0200.desc:0 "The rough settlement has outgrown its first clearings. Its paths are open, its first dwellings are secure, and the people here now look to us to decide what shape this place should take."
 aawc_population_event.0200.castle:0 "Raise it as a castle."
 aawc_population_event.0200.temple:0 "Dedicate it as a temple."
 aawc_population_event.0200.city:0 "Charter it as a city."

