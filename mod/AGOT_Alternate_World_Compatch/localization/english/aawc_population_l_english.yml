 AAWC_POPULATION_TT_HOLDING_DEV:0 "Development is county-level. This value is the current county development level used by this holding."
  AAWC_POPULATION_TT_HOLDING_WEIGHT:0 "#T Holding Type#!\nType: #high [HoldingView.GetProvince.Custom('AAWC_PopulationHoldingType')]#!\nMain capacity: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_dev_weight'))]#!\n\nThe holding type and main holding level provide the base capacity for this holding. County development scales the main capacity. Population itself is updated monthly by the cohort ledger."
 AAWC_POPULATION_TT_HOLDING_INCOME:0 "Expected population capacity supplied by this holding's regular and duchy buildings."
 AAWC_POPULATION_TT_HOLDING_BUILDING_CAPACITY_DEBUG:0 "#T Capacity Adjustment#!\nCapacity adjustment: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_building_expected_capacity'))]#!\n\nAggregate adjustment from regular and duchy buildings, geography, structural living conditions, and settlement-space effects. It is applied alongside the main capacity from holding type, holding level, and county development."
 AAWC_POPULATION_TT_HOLDING_BUILDING_CAPACITY_BREAKDOWN:0 "#T Capacity Adjustment#!\nCapacity adjustment: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_building_expected_capacity'))]#!\n\nAggregate adjustment from regular and duchy buildings, geography, structural living conditions, and settlement-space effects. It may be positive or negative and is applied alongside the main capacity from the holding type, main holding level, and county development.\n[Localize('AAWC_POPULATION_BCAP_LINES_01')][Localize('AAWC_POPULATION_BCAP_LINES_02')][Localize('AAWC_POPULATION_BCAP_LINES_03')][Localize('AAWC_POPULATION_BCAP_LINES_04')][Localize('AAWC_POPULATION_BCAP_LINES_05')][Localize('AAWC_POPULATION_BCAP_LINES_06')][Localize('AAWC_POPULATION_BCAP_LINES_07')][Localize('AAWC_POPULATION_BCAP_LINES_08')][Localize('AAWC_POPULATION_BCAP_LINES_09')][Localize('AAWC_POPULATION_BCAP_LINES_10')][Localize('AAWC_POPULATION_BCAP_LINES_11')][Localize('AAWC_POPULATION_BCAP_LINES_12')][Localize('AAWC_POPULATION_BCAP_LINES_13')][Localize('AAWC_POPULATION_BCAP_LINES_14')][Localize('AAWC_POPULATION_BCAP_LINES_15')][Localize('AAWC_POPULATION_BCAP_LINES_16')][Localize('AAWC_POPULATION_BCAP_LINES_17')][Localize('AAWC_POPULATION_BCAP_LINES_18')][Localize('AAWC_POPULATION_BCAP_LINES_19')][Localize('AAWC_POPULATION_BCAP_LINES_20')][Localize('AAWC_POPULATION_BCAP_LINES_21')][Localize('AAWC_POPULATION_BCAP_LINES_22')][Localize('AAWC_POPULATION_BCAP_LINES_23')][Localize('AAWC_POPULATION_BCAP_LINES_24')]"
 AAWC_POPULATION_TT_HOLDING_LEVIES:0 "Growth rating supplied by this holding's buildings."
  AAWC_POPULATION_TT_HOLDING_GROWTH_RATING:0 "#T Growth Rating#!\nBuilding growth rating: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_growth_rating'))]#!\n\nGrowth rating is supplied by buildings. It is retained as legacy capacity context; the monthly cohort ledger, rather than this rating, authoritatively changes population."
  AAWC_POPULATION_TT_HOLDING_GROWTH_RATING_BREAKDOWN:0 "#T Growth Rating#!\nBuilding growth rating: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_growth_rating'))]#!\nCurrent building multiplier: #high [HoldingView.GetProvince.Custom('AAWC_PopGrowthRatingMultiplierText')]#!\nCurrent terrain multiplier: #high [HoldingView.GetProvince.Custom('AAWC_PopTerrainMultiplierText')]#!\n\nThese are retained legacy capacity-context values. The authoritative population update runs monthly from cohort births, mortality, and aging; it does not use this row as a population-growth payment."
  AAWC_POPULATION_TT_HOLDING_LEVIES_DEBUG:0 "#T Growth Rate#!\nThis row is retained as legacy capacity and pressure context. Population is authoritatively updated once each month by cohort births, mortality, and aging.\n\n#tooltip:AAWC_POPULATION_HELP_POPULATION_PRESSURE #E Population pressure#!#! compares current population to expected population. Current pressure multiplier: #high [HoldingView.GetProvince.Custom('AAWC_PopPressureMultiplierText')]#!.\n\n#tooltip:AAWC_POPULATION_HELP_PLAGUES #E Plagues#!#! increase mortality in the monthly cohort update. Current plague status: [HoldingView.GetProvince.Custom('AAWC_PopulationDiseaseGrowthStatus')]\n[HoldingView.GetProvince.Custom('AAWC_PopulationWarfareGrowthStatus')]"
 AAWC_POPULATION_HELP_BUILDING_GROWTH_RATING:0 "#T Building Growth Rating#!\nBuildings add positive or negative rating points. The combined rating is converted into the building multiplier used by Growth Rating.\n\nRating thresholds:\n#N -500#! or lower: #high x0.10#!\n#N -400#!: #high x0.15#!\n#N -300#!: #high x0.22#!\n#N -220#!: #high x0.32#!\n#N -150#!: #high x0.45#!\n#N -100#!: #high x0.58#!\n#N -65#!: #high x0.72#!\n#N -35#!: #high x0.85#!\n#N -15#!: #high x0.93#!\n#high -14 to 4#!: #high x1.00#!\n#P 5#!: #high x1.10#!\n#P 15#!: #high x1.20#!\n#P 40#!: #high x1.30#!\n#P 80#!: #high x1.40#!\n#P 140#!: #high x1.50#!\n#P 220#!: #high x1.65#!\n#P 320#!: #high x1.80#!\n#P 420#!: #high x1.92#!\n#P 500#! or higher: #high x2.00#!"
 AAWC_POPULATION_HELP_TERRAIN_SUITABILITY:0 "#T Terrain Suitability#!\nTerrain suitability represents how easily local terrain supports population growth.\n\nUrban: #P x1.30#!\nFarmlands, floodplains, oasis: #P x1.25#!\nPlains, forest, taiga, cloud forest: #P x1.10#!\nSteppe, hills: #P x1.05#!\nWetlands and bogs: #N x0.95#!\nMountains, highlands, desert mountains, canyon: #N x0.90#!\nDrylands: #N x0.85#!\nDesert, glacier, frozen flats: #N x0.70#!"
 AAWC_POPULATION_HELP_POPULATION_PRESSURE:0 "#T Population Pressure#!\nPopulation pressure compares current population to expected population. It tapers growth as a holding fills.\n\n0-5% expected: #P x2.00#!\n5-10%: #P x1.80#!\n10-15%: #P x1.60#!\n15-20%: #P x1.40#!\n20-25%: #P x1.20#!\n25-75%: #high x1.00#!\n75-80%: #high x0.99#!\n80-85%: #high x0.96#!\n85-90%: #high x0.91#!\n90-95%: #high x0.84#!\n95-100%: #high x0.75#!\n100-105%: #N x0.64#!\n105-110%: #N x0.51#!\n110-115%: #N x0.36#!\n115-120%: #N x0.19#!\n120-125%: #N x0.05#!\n125% or higher: #N x0.00#!"
  AAWC_POPULATION_HELP_PLAGUES:0 "#T Plagues#!\nWhen an epidemic is present in the county, it increases mortality during the authoritative monthly cohort update.\n\nNo active plague: normal cohort mortality applies.\nMinor plague: increased mortality.\nMajor plague: substantially increased mortality.\nApocalyptic plague: greatly increased mortality."
 AAWC_POPULATION_TT_HOLDING_MILITARY_CONTRIBUTION:0 "#T Military Contribution#!\nMaximum monthly contribution: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_max_military_contribution'))]#! population.\n\nA holding can contribute population toward men-at-arms replenishment only from population above its protective floor. It can spend no more than #high 1%#! of its current population each month.\n\nProtective floor: the lower of #high 25%#! expected capacity (#high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_military_floor_percent_value'))]#!) or #high 2000#! population. Current protected floor: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_military_protected_floor_display'))]#!.\n\nLast Month Contributions (1 year): #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_last_military_contribution'))]#! (#high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_population_holding_yearly_military_contribution'))]#!)."
 AAWC_POPULATION_TT_COUNTY_MIGRATION:0 "#T County Migration#!\nCounty migration this month: #high [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_projected_display'))]#! population.\nMigration rating: #high [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_rating_display'))]#!.\n\nEach month, directly adjacent counties compare migration ratings, including counties held by the same ruler or within the same realm. Population moves from the lower-rated county to the higher-rated county at #high 1#! population per rating point difference, limited by both counties' population pressure caps.\n\nIn peacetime, migrants only move to adjacent counties that share either their CaFG-synchronized county-majority faith or county-majority culture. Counties at war can send refugees to mismatched neighbors, but peaceful counties will not migrate into a realm at war unless both sides are at war.\n\nPopulation pressure: #high [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_population_pressure_percent_display'))]%#! of expected capacity.\nCan leave: #N [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_leaving_percent_display'))]%#!, up to #N [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_give_cap_display'))]#! people.\nCan enter: #P [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_entering_percent_display'))]%#!, up to #P [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_receive_cap_display'))]#! people. A county at or above 100% expected population has no entering allowance, even from another county in the same realm.\n\nBase rating: #high [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_base_rating_display'))]#!.\nPopular opinion: #high [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_popular_opinion_rating_display'))]#!.\nWar penalty: #N -[FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_war_rating_penalty_display'))]#!.\nCounty-holder faith mismatch: #N -[FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_direct_faith_penalty_display'))]#!.\nCounty-holder culture mismatch: #N -[FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_direct_culture_penalty_display'))]#!.\nLiege faith mismatch penalties: #N -[FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_liege_faith_penalty_display'))]#!.\nLiege culture mismatch penalties: #N -[FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_liege_culture_penalty_display'))]#!.\nBuilding migration rating: #high [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_building_rating_display'))]#!. This is the rounded average of the migration ratings supplied by each populated holding's main holding tier and constructed buildings.\n\nDirectly adjacent counties: #high [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_adjacent_count_display'))]#!. Faith/culture/war eligible neighbors: #high [FixedPointToInt(HoldingView.GetCountyTitle.MakeScope.ScriptValue('aawc_migration_county_neighbor_targets_display'))]#!. Rating direction and current send/receive allowances determine whether population can actually move. Active siege or raid blocks county migration."
 AAWC_POPULATION_TT_HOLDING_MIGRATION:0 "#T Holding Migration#!\nHolding migration this month: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_projected_display'))]#! population.\n\n#high County Migration#!\nThis holding receives or supplies part of the county's migration with directly adjacent counties. Its main holding tier and constructed buildings supply #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_building_rating_display'))]#! rating toward the county's averaged building migration rating. County migration can move up to #high 5%#! of each holding's population, limited by the county's rating comparison and whether this holding can give or receive people.\n\nCounty migration rate used here: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_county_share_percent_display'))]%#!.\nCounty-wide share this month: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_county_share_display'))]#!.\nCounty send cap: #N [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_county_give_cap_display'))]#!. County receive cap: #P [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_county_receive_cap_display'))]#!.\n\n#high Holding Migration#!\nInside the county, holdings below expected capacity pull population from holdings with surplus. Internal holding migration can move up to #high 3%#! of each holding's population each month.\n\nInternal migration rate: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_internal_percent_display'))]%#!.\nInternal movement this month: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_internal_display'))]#!.\nInternal send cap: #N [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_internal_give_cap_display'))]#!. Internal receive cap: #P [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_internal_receive_cap_display'))]#!.\nProtective floor: #high [FixedPointToInt(HoldingView.GetProvince.MakeScope.ScriptValue('aawc_migration_holding_protective_floor_display'))]#! population."
