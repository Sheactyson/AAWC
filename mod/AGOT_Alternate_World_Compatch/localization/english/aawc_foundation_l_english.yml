 aawc_foundation.0100.b:0 "Order and administration will guide us."
 aawc_foundation.0100.c:0 "Community and mutual duty will guide us."
 aawc_foundation.0100.d:0 "Courtesy and refinement will guide us."
 aawc_foundation.0100.e:0 "Equality and shared voice will guide us."
 aawc_foundation.0100.f:0 "Faith and contemplation will guide us."
