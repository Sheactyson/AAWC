 aawc_foundation.0001.t:0 "Name a New Culture"
 aawc_foundation.0001.desc:0 "The old culture has been lost. Use your capital county name by default, or choose a name of your own before selecting the ethos, roots, and founding tradition that will guide your people."
 aawc_foundation.0001.a:0 "Found the culture of [GetGlobalVariable('aawc_1103_culture_namer').Char.GetCapitalLocation.GetName]."
 aawc_foundation.0001.b:0 "Choose a different culture name."
 aawc_foundation.0003.t:0 "Choose a New Culture Name"
 aawc_foundation.0003.desc:0 "Enter a name for your people. Select the capital-name option instead if you decide not to use a custom name."
 aawc_foundation.0003.a:0 "Continue with this custom name."
 aawc_foundation.0003.b:0 "Use the capital county name instead."
 aawc_foundation.0002.t:0 "Choose a Spiritual Origin"
 aawc_foundation.0002.desc:0 "The old gods have been forgotten. Choose the spiritual tradition from which your people will build a new faith."
