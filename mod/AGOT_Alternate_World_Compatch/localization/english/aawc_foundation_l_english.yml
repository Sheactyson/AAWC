 aawc_foundation.0299.t:0 "Found a New Faith"
 aawc_foundation.0299.desc:0 "Your court and capital now follow the selected Lost seed faith. Open the Faith window and use Create New Faith to define its three tenets, rites, doctrines, name, color, and icon. The foundation costs no Piety, and the completed faith will immediately be adopted by your court and capital."
 aawc_foundation.0299.a:0 "Our people will decide what endures."

 aawc_1103_free_faith_foundation_modifier:0 "Founding a New Faith"
 aawc_1103_free_faith_foundation_modifier_desc:0 "The first faith founded after the world was shattered costs no Piety."
