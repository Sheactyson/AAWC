aawc_lov_elyria_great_port_ruined_01:0 "Great Port of Elyria in Ruins"
aawc_lov_elyria_great_port_ruined_01_desc:0 "The harbor still hints at the trade it once commanded, but broken quays and unsafe docks make it costly and dangerous to use."
aawc_lov_elyria_great_port_maintained_01:0 "Great Port of Elyria Under Maintenance"
aawc_lov_elyria_great_port_maintained_01_desc:0 "Repairs have begun across the harbor, restoring only a fraction of its former utility while the work continues."
aawc_lov_elyria_dragon_palace_ruined_01:0 "Dragon Palace of Elyria in Ruins"
aawc_lov_elyria_dragon_palace_ruined_01_desc:0 "The shattered palace is a dynastic embarrassment and a dangerous shell of its former grandeur."
aawc_lov_elyria_dragon_palace_maintained_01:0 "Dragon Palace of Elyria Under Maintenance"
aawc_lov_elyria_dragon_palace_maintained_01_desc:0 "The palace is stabilized and partially restored, but it has not yet regained its full prestige or strength."
aawc_lov_valyria_mines_ruined_01:0 "Valyrian Mines in Ruins"
aawc_lov_valyria_mines_ruined_01_desc:0 "Collapsed shafts, poisonous air, and unstable tunnels make these ruins a deadly burden rather than an asset."
aawc_lov_valyria_mines_maintained_01:0 "Valyrian Mines Under Maintenance"
aawc_lov_valyria_mines_maintained_01_desc:0 "Survey crews and laborers have reopened parts of the mine, though danger and disruption remain severe."
aawc_lov_valyria_mines_dormant_ruined_01:0 "Dormant Valyrian Mines in Ruins"
aawc_lov_valyria_mines_dormant_ruined_01_desc:0 "Even dormant workings are unstable and dangerous when left in ruin, draining effort and inviting disaster."
aawc_lov_valyria_mines_dormant_maintained_01:0 "Dormant Valyrian Mines Under Maintenance"
aawc_lov_valyria_mines_dormant_maintained_01_desc:0 "The dormant mine has been stabilized and partially cleared, but it remains far from fully restored."

