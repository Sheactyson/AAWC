 aawc_reforging_stage1a.0003.t:0 "AAWC Reforging Milestone 1 — Advance One Test Month"
 aawc_reforging_stage1a.fixture_pass:0 "#P PASS#! — The capital-province cohort fixture is complete and internally consistent.\n\nAge bands: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_00_04').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_05_09').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_10_14').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_15_19').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_20_24').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_25_29').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_30_34').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_35_39').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_40_44').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_45_49').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_50_54').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_55_59').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_60_plus').GetValue|0]#!\nBand total: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_cohort_band_sum'))]#!\nAdults: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_adult_band_sum'))]#!\nMilitary overlay: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_military_overlay_sum'))]#!\nCivilian adults: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_civilian_available_adults'))]#!\nInvariant: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_cohort_invariant_status'))]#!\nExact fixture: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_cohort_test_fixture_status'))]#!"
 aawc_reforging_stage1a.fixture_fail:0 "#N FAIL#! — The capital-province cohort fixture is absent or violates at least one Stage 1A invariant. Do not advance this pilot.\n\nBand total: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_cohort_band_sum'))]#!\nAdults: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_adult_band_sum'))]#!\nMilitary overlay: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_military_overlay_sum'))]#!\nCivilian adults: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_civilian_available_adults'))]#!\nInvariant: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_cohort_invariant_status'))]#!\nExact fixture: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_cohort_test_fixture_status'))]#!"
 aawc_reforging_stage1a.0001.a:0 "Record the initialized fixture."
 aawc_reforging_stage1a.0002.a:0 "Record the persisted fixture."
 aawc_reforging_stage1a.0003.a:0 "Record the cohort tick."
 aawc_reforging_stage1a.tick_pass:0 "#P PASS#! — One guarded cohort month completed with exact birth/death accounting, bounded military overlays, normalized fractional carries, and synchronized aggregate mirrors.\n\nTick: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_last_tick').GetValue|0]#!\nPopulation: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_total_mirror').GetValue|0]#!\nBirths: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_last_births').GetValue|0]#!\nDeaths: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_last_deaths').GetValue|0]#!\nAged: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_last_aged').GetValue|0]#!\nInvariant: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_cohort_stage1_invariant_status'))]#!"
 aawc_reforging_stage1a.tick_fail:0 "#N FAIL#! — The attempted cohort month is absent or violates accounting/invariant checks. Stop this pilot and inspect the log.\n\nPopulation: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_total_mirror').GetValue|0]#!\nInvariant: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_cohort_stage1_invariant_status'))]#!\nAccounting: #high [FixedPointToInt(ROOT.Char.GetCapitalLocation.MakeScope.ScriptValue('aawc_reforging_cohort_last_tick_accounting_status'))]#!"
 aawc_reforging_stage1a.persistence_pass:0 "#P PASS#! — The event .0003 checkpoint survived reload: all 35 fractional carries and the guarded tick serial/count exactly match, and the full Stage 1 invariant still passes. This inspection performed no repair or initialization."
 aawc_reforging_stage1a.persistence_fail:0 "#N FAIL#! — The event .0003 checkpoint is absent, at least one of the 35 fractional carries or tick fields changed, or the Stage 1 invariant failed. Do not reinitialize; inspect the error log."
 aawc_reforging_stage1a_initialize_decision:0 "TEST: Initialize Stage 1A fixture"
 aawc_reforging_stage1a_initialize_decision_desc:0 "DISPOSABLE CAMPAIGN ONLY. Replace the actual capital cohort fields with a 100-person fixture. This changes live demographic state and makes this save unsuitable for production or long-run certification."
 aawc_reforging_stage1a_initialize_decision_tooltip:0 "DISPOSABLE CAMPAIGN ONLY. Replace the actual capital cohort fields with a 100-person fixture. This changes live demographic state and makes this save unsuitable for production or long-run certification."
 aawc_reforging_stage1a_initialize_decision_confirm:0 "Initialize test fixture"
 aawc_reforging_stage1a_inspect_decision:0 "TEST: Inspect Milestone 1 persistence"
 aawc_reforging_stage1a_inspect_decision_desc:0 "Read the existing capital-province event .0003 checkpoint without initializing or repairing it. Use after save/reload in the same capital; the result covers all 35 fractional carries and the tick serial/count."
 aawc_reforging_stage1a_inspect_decision_tooltip:0 "Read the existing capital-province event .0003 checkpoint without initializing or repairing it. Use after save/reload in the same capital; the result covers all 35 fractional carries and the tick serial/count."
 aawc_reforging_stage1a_inspect_decision_confirm:0 "Inspect without changes"
 aawc_reforging_stage1a_advance_tick_decision:0 "TEST: Advance one Milestone 1 cohort month"
 aawc_reforging_stage1a_advance_tick_decision_desc:0 "DISPOSABLE CAMPAIGN ONLY. Advance the actual capital cohort ledger by one test month. This changes live demographic state. Never continue production or long-run certification from this fixture save."
 aawc_reforging_stage1a_advance_tick_decision_tooltip:0 "DISPOSABLE CAMPAIGN ONLY. Advance the actual capital cohort ledger by one test month. This changes live demographic state. Never continue production or long-run certification from this fixture save."
 aawc_reforging_stage1a_advance_tick_decision_confirm:0 "Advance one fixture month"
