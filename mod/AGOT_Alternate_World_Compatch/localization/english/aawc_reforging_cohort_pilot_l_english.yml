 aawc_reforging_stage1a.0005.t:0 "AAWC Reforging Milestone 1 — World-Cost Cohort Run"
 aawc_reforging_stage1a.0006.t:0 "AAWC Reforging Milestone 1 — Military Runtime Fixture"
 aawc_reforging_stage1a.0004.a:0 "Close baseline result"
 aawc_reforging_stage1a.0005.a:0 "Close cohort result"
 aawc_reforging_stage1a.0006.a:0 "Use this disposable fixture"
 aawc_reforging_stage1a.full_state_vector:0 "\n\nBands 0–60+: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_00_04').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_05_09').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_10_14').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_15_19').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_20_24').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_25_29').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_30_34').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_35_39').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_40_44').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_45_49').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_50_54').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_55_59').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_age_60_plus').GetValue|0]#!\nMilitary 15–59: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_age_15_19').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_age_20_24').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_age_25_29').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_age_30_34').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_age_35_39').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_age_40_44').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_age_45_49').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_age_50_54').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_age_55_59').GetValue|0]#!\nMirrors children/young/older/elderly/total/military/civilian: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_children_mirror').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_young_adults_mirror').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_older_adults_mirror').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_elderly_mirror').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_total_mirror').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_military_total_mirror').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_civilian_adults_mirror').GetValue|0]#!\nMilitary aged/retired: #high [ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_last_military_aged').GetValue|0]/[ROOT.Char.GetCapitalLocation.MakeScope.Var('aawc_reforging_cohort_last_military_retired').GetValue|0]#!"
 aawc_reforging_stage1a.benchmark_baseline_pass:0 "#P PASS#! — Same-scan baseline completed. Provinces: #high [ROOT.Char.MakeScope.Var('aawc_reforging_benchmark_count').GetValue|0]#!; inner operations: #high [ROOT.Char.MakeScope.Var('aawc_reforging_benchmark_operations').GetValue|0]#!. Record wall time from confirmation to this rendered result."
 aawc_reforging_stage1a.benchmark_baseline_fail:0 "#N FAIL#! — Baseline did not reach exactly 1,024 eligible provinces and 12,288 inner operations. Stop performance certification."
 aawc_reforging_stage1a.benchmark_engine_pass:0 "#P PASS#! — Bounded cohort run completed and transient province state was removed. Provinces: #high [ROOT.Char.MakeScope.Var('aawc_reforging_benchmark_count').GetValue|0]#!; ledger-months: #high [ROOT.Char.MakeScope.Var('aawc_reforging_benchmark_operations').GetValue|0]#!; population checksum: #high [ROOT.Char.MakeScope.Var('aawc_reforging_benchmark_population_checksum').GetValue|0]#!; military checksum: #high [ROOT.Char.MakeScope.Var('aawc_reforging_benchmark_military_checksum').GetValue|0]#!; invariant failures: #high [ROOT.Char.MakeScope.Var('aawc_reforging_benchmark_invariant_failures').GetValue|0]#!. Record wall time and repeat for checksum equality."
 aawc_reforging_stage1a.benchmark_engine_fail:0 "#N FAIL#! — The bounded cohort run missed its exact scope/operation count, produced no population checksum, or found an invariant failure. Stop performance certification."
 aawc_reforging_stage1a.military_fixture_pass:0 "#P PASS#! — Disposable disposable fixture prepared: population 33, military overlay 24, divergent 15–19 military carry, real adult movers, and a fully military 55–59 retirement case. Run exactly one cohort month next."
 aawc_reforging_stage1a.military_fixture_fail:0 "#N FAIL#! — The disposable military fixture was not prepared exactly. Do not advance or save it."
 aawc_reforging_stage1a_prepare_military_fixture_decision:0 "TEST: Prepare nonzero military fixture"
 aawc_reforging_stage1a_prepare_military_fixture_decision_desc:0 "Disposable test only. Replace the disposable campaign capital cohort fixture with the reviewed 33-person/24-military adversarial state. This overwrites live demographic state; never use this save for production certification."
 aawc_reforging_stage1a_prepare_military_fixture_decision_tooltip:0 "Prepare divergent military carries, actual parent movers and an age-60 retirement case in the actual capital ledger on this disposable campaign."
 aawc_reforging_stage1a_prepare_military_fixture_decision_confirm:0 "Replace disposable fixture"
 aawc_reforging_stage1a_benchmark_baseline_decision:0 "TEST: Run world-cost baseline"
 aawc_reforging_stage1a_benchmark_baseline_decision_desc:0 "Bounded test only. Scan the same eligible world scope as the cohort benchmark and perform 12,288 counter operations without creating province ledgers."
 aawc_reforging_stage1a_benchmark_baseline_decision_tooltip:0 "Run the 1,024-province x 12-operation baseline for external wall-clock comparison."
 aawc_reforging_stage1a_benchmark_baseline_decision_confirm:0 "Run baseline"
 aawc_reforging_stage1a_benchmark_engine_decision:0 "TEST: Run bounded world cohort benchmark"
 aawc_reforging_stage1a_benchmark_engine_decision_desc:0 "Bounded test only. Run 12 cohort months on 1,024 eligible provinces, report deterministic checksums/invariants, then remove all transient province ledgers."
 aawc_reforging_stage1a_benchmark_engine_decision_tooltip:0 "Run 12,288 isolated ledger-months, report checksums, and clean all transient province state."
 aawc_reforging_stage1a_benchmark_engine_decision_confirm:0 "Run bounded cohort benchmark"
 aawc_reforging_stage1a.0007.t:0 "AAWC Reforging Milestone 1 — Production Adapter Regression"
 aawc_reforging_stage1a.0007.a:0 "Record the cleaned production regression"
 aawc_reforging_stage1a.production_runtime_pass:0 "#P PASS#! — All nine production cohort adapters executed in CK3 across two verified-empty provinces. Initialization, credit, bounded debit, death accounting, absolute target-setting, legacy-mirror parity, invariants, and both sides of the signed transfer passed. The paired total remained #high [ROOT.Char.MakeScope.Var('aawc_reforging_production_runtime_before_total').GetValue|0]#! before and #high [ROOT.Char.MakeScope.Var('aawc_reforging_production_runtime_after_total').GetValue|0]#! after. Both disposable ledgers were removed before this result was rendered."
 aawc_reforging_stage1a.production_runtime_fail:0 "#N FAIL#! — The production-adapter regression failed or could not find exactly two verified-empty provinces. Selected: #high [ROOT.Char.MakeScope.Var('aawc_reforging_production_runtime_selected').GetValue|0]#!; failures: #high [ROOT.Char.MakeScope.Var('aawc_reforging_production_runtime_failures').GetValue|0]#!; before/after: #high [ROOT.Char.MakeScope.Var('aawc_reforging_production_runtime_before_total').GetValue|0]/[ROOT.Char.MakeScope.Var('aawc_reforging_production_runtime_after_total').GetValue|0]#!. Stop certification and inspect the error log."
 aawc_reforging_stage1a_production_runtime_decision:0 "TEST: Run production cohort adapters"
 aawc_reforging_stage1a_production_runtime_decision_desc:0 "Disposable post-migration regression. Exercise all production cohort adapters and a conserving two-province transfer only on verified-empty provinces, then remove every test variable."
 aawc_reforging_stage1a_production_runtime_decision_tooltip:0 "Run the self-cleaning production-adapter and paired-transfer regression."
 aawc_reforging_stage1a_production_runtime_decision_confirm:0 "Run production regression"
 aawc_reforging_stage1a.0008.t:0 "AAWC Reforging Milestone 1 — Zero-Mover Regression"
 aawc_reforging_stage1a.0008.a:0 "Record the cleaned zero-mover regression"
 aawc_reforging_stage1a.zero_mover_runtime_pass:0 "#P PASS#! — A guarded cohort month completed on a disposable one-person adult/military ledger with divergent carries and zero integer aging movers. Accounting, invariants, military membership, tick identity, absent-work handling, and complete cleanup passed."
 aawc_reforging_stage1a.zero_mover_runtime_fail:0 "#N FAIL#! — The zero-mover cohort regression failed or could not find one verified-empty province. Selected: #high [ROOT.Char.MakeScope.Var('aawc_reforging_zero_mover_runtime_selected').GetValue|0]#!; failures: #high [ROOT.Char.MakeScope.Var('aawc_reforging_zero_mover_runtime_failures').GetValue|0]#!. Stop certification and inspect the debug log for an absent-variable read."
 aawc_reforging_stage1a_zero_mover_runtime_decision:0 "TEST: Run zero-mover cohort month"
 aawc_reforging_stage1a_zero_mover_runtime_decision_desc:0 "Disposable regression for CK3's zero-valued transient-variable behavior. Run one cohort month with no integer aging movers on one verified-empty province, then remove every test variable."
 aawc_reforging_stage1a_zero_mover_runtime_decision_tooltip:0 "Prove that an ordinary zero-mover month completes without reading an absent work variable."
 aawc_reforging_stage1a_zero_mover_runtime_decision_confirm:0 "Run zero-mover regression"

 rule_aawc_reforging_fixture_mode:0 "AAWC: Disposable Test Fixtures"
 setting_aawc_reforging_fixtures_disabled:0 "Disabled"
 setting_aawc_reforging_fixtures_disabled_desc:0 "Normal campaigns and production certification. Destructive fixture actions are unavailable."
 setting_aawc_reforging_disposable_fixtures:0 "Disposable Test Campaign"
 setting_aawc_reforging_disposable_fixtures_desc:0 "Enables destructive fixture actions on real province ledgers. Use only in a fresh isolated test session. Saves from this mode cannot certify production or long-run behavior."
