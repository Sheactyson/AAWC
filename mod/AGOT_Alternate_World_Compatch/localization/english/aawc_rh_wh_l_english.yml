l_english:
 game_rule_category_aawc_rules:0 "AGOT Alternate World Compatch"
 aawc_rh_candidate_marker:0 "AAWC RH Candidate"
 aawc_rh_candidate_marker_desc:0 "This county has been flagged by AAWC as a candidate for future Ruin Holding conversion."
 aawc_wh_candidate_marker:0 "AAWC WH Candidate"
 aawc_wh_candidate_marker_desc:0 "This county has been flagged by AAWC as a candidate for future Wilderness Holding conversion."
 aawc_survivor_pocket_marker:0 "AAWC Survivor Pocket"
 aawc_survivor_pocket_marker_desc:0 "In Age of Reclamation mode, this county remains a normal holding as one of the surviving pockets of civilization."
 rule_aawc_ruin_wilderness_generation:0 "AAWC: Ruin/Wilderness Generation"
 rule_aawc_ruin_wilderness_generation_desc:0 "Controls how the compatch selects Ruin Holding and Wilderness Holding candidates after the tribal and shattered setup finishes."
 setting_aawc_ruined_world:0 "Ruined World"
 setting_aawc_ruined_world_desc:0 "RH comes from special buildings or open special slots. Adjacent counties then have a 50% chance to become WH."
 setting_aawc_age_of_reclamation:0 "Age of Reclamation"
 setting_aawc_age_of_reclamation_desc:0 "RH comes from special buildings or open slots. Other counties become WH, except one random survivor per de jure kingdom."
 setting_aawc_age_of_silence:0 "Age of Silence"
 setting_aawc_age_of_silence_desc:0 "The old world is entirely silent. Every county begins as ruin or wilderness, with no survivor pockets. Create a landless adventurer and choose where civilization will begin again."
 aawc_colonization_camp_purpose:0 "Colonization Purpose"
 aawc_colonization_camp_purpose_desc:0 "This camp exists to cross the empty world and establish its first permanent settlement."
 aawc_camp_purpose_colonization:0 "Colonization"
 aawc_camp_purpose_colonization_desc:0 "Colonization camps consume no provisions while traveling, move rapidly across the empty world, and may establish a settlement in wilderness during the Age of Silence."
 AAWC_AGE_OF_SILENCE_SETTLE:0 "Settle"
 AAWC_AGE_OF_SILENCE_SETTLE_TT:0 "Establish your first permanent settlement in this wilderness county. Your Colonization camp must be present in the county before you can settle it. Ruined holdings must be reclaimed through their separate restoration process."
 aawc_age_of_silence_can_settle_wilderness_tt:0 "This wilderness can become the first settlement of the new age."
 aawc_age_of_silence_settle_wilderness_effect_tt:0 "Found a tribal holding here at no cost. You must personally travel to the destination before the county is claimed."
 aawc_age_of_silence_native_settle_requires_wh_tt:0 "Your colonization camp can settle only a wilderness holding. Ruins must first be reclaimed through their own restoration process."
 rule_aawc_lost_faith_culture:0 "AAWC: Lost Faith & Culture"
 rule_aawc_lost_faith_culture_desc:0 "Controls whether shattered-world characters and counties begin with the shared Lost faith and culture after the normal shatter workflow finishes."
 setting_aawc_lost_faith_culture_disabled:0 "Disabled"
 setting_aawc_lost_faith_culture_disabled_desc:0 "Will faith and culture remain? Enable this rule to set all characters to a lost religion and culture. "
 setting_aawc_lost_faith_culture_enabled:0 "Enabled"
 setting_aawc_lost_faith_culture_enabled_desc:0 "The names of old gods and peoples fade into ash. Every character and county begins with Lost faith and Lost culture."
 setting_aawc_lost_faith_culture_faith_only:0 "Faith Only"
 setting_aawc_lost_faith_culture_faith_only_desc:0 "The old peoples remember their tongues and customs, but not the sacred truths that once bound them. Faith is set to Lost; culture remains."
 setting_aawc_lost_faith_culture_culture_only:0 "Culture Only"
 setting_aawc_lost_faith_culture_culture_only_desc:0 "The gods remain familiar, but every banner rises from a people whose old customs have been scattered. Culture is set to Lost; faith remains."
 rule_aawc_diagnostic_logging:0 "AAWC: Diagnostic Logging"
 rule_aawc_diagnostic_logging_desc:0 "Controls how much diagnostic information AAWC writes to CK3's logs. This rule does not alter gameplay calculations or outcomes."
 setting_aawc_diagnostics_disabled:0 "Disabled"
 setting_aawc_diagnostics_disabled_desc:0 "Suppress routine AAWC diagnostic messages. Engine and parser errors may still be written by CK3."
 setting_aawc_diagnostics_summary:0 "Summary"
 setting_aawc_diagnostics_summary_desc:0 "Record concise AAWC pulse, recovery, migration, AI-action, and safety outcomes without per-holding calculation traces."
 setting_aawc_diagnostics_verbose:0 "Verbose"
 setting_aawc_diagnostics_verbose_desc:0 "Record detailed AAWC calculation paths for compatibility testing and difficult bug investigations. This can produce large log files."
 aawc_lost_religion:0 "Lost"
 aawc_lost_religion_adj:0 "Lost"
 aawc_lost_religion_adherent:0 "Lost"
 aawc_lost_religion_adherent_plural:0 "Lost"
 aawc_lost_religion_desc:0 "The world remembers that people once prayed, but not what those prayers meant. The Lost faith is an empty remnant of broken rites, half-kept customs, and names no one can explain."
 aawc_lost_faith:0 "Lost"
 aawc_lost_faith_adj:0 "Lost"
 aawc_lost_faith_adherent:0 "Lost"
 aawc_lost_faith_adherent_plural:0 "Lost"
 aawc_lost_faith_desc:0 "The old faiths are gone from living memory. Those counted among the Lost keep no true doctrine, no holy inheritance, and no blessing beyond the need to begin again."
 aawc_lost_culture:0 "Lost"
 aawc_lost_culture_prefix:0 "Lost"
 aawc_lost_culture_collective_noun:0 "Lost"
 aawc_lost_culture_desc:0 "The old songs, laws, grudges, and bloodlines have been stripped down to fragments. The Lost share little beyond survival and the burden of deciding what kind of people they will become."
 aawc_ethos_lost:0 "Lost"
 aawc_ethos_lost_name:0 "Lost"
 aawc_ethos_lost_desc:0 "This culture has no inherited identity strong enough to guide it. It must become something new."
 heritage_aawc_lost:0 "Lost Heritage"
 heritage_aawc_lost_name:0 "Lost Heritage"
 heritage_aawc_lost_desc:0 "No remembered people, homeland, or inherited past remains to bind the Lost to an older cultural age."
